spring.application.name=backend

# Connexion MySQL
# Valeurs par defaut = confort en dev local uniquement (root sans mot de passe).
# En prod, DB_USERNAME/DB_PASSWORD DOIVENT etre definies comme variables
# d'environnement (jamais commiter de vrai mot de passe dans ce fichier).
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/guidly_db?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
# show-sql desactive par defaut (fuite d'infos + perf en prod).
# Mettre SHOW_SQL=true en local si besoin de debugger les requetes.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Port du serveur
server.port=${SERVER_PORT:8080}

# IMPORTANT : JWT_SECRET DOIT etre defini en variable d'environnement en prod.
# La valeur par defaut ci-dessous n'est valable qu'en dev local, elle ne doit
# JAMAIS etre utilisee telle quelle en production (cle predictible = tokens
# forgeables par n'importe qui).
jwt.secret=${JWT_SECRET:guidly-dev-only-secret-change-me-1234567890}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
